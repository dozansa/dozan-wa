# Dozan WA — Huawei Cloud ECS overlay.
# Used together with the root docker-compose.yml:
#   docker compose -f docker-compose.yml -f deploy/huawei/docker-compose.huawei.yml --profile postgres up -d
services:
  caddy:
    image: caddy:2-alpine
    container_name: dozan-wa-caddy
    restart: unless-stopped
    depends_on:
      - openwa-api
    networks:
      - openwa-network
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./deploy/huawei/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  openwa-api:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
